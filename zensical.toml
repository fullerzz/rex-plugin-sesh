[project]
site_name = "rex-sesh"
site_description = "A Sesh-style session picker for the Rex terminal."
site_author = "Zach Fuller"
site_url = "https://fullerzz.github.io/rex-plugin-sesh/"
repo_url = "https://github.com/fullerzz/rex-plugin-sesh"
repo_name = "fullerzz/rex-plugin-sesh"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Zach Fuller"

nav = [
  { "Get started" = "index.md" },
  { "Configuration" = [
    { "Overview" = "config.md" },
    { "Picker" = "config/picker.md" },
    { "Layouts" = "config/layouts.md" },
  ] },
  { "Rex setup" = "rex-app.md" },
  { "Commands" = "commands.md" },
  { "Keybindings" = "keybindings.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Development" = [
    { "Contributing" = "development/index.md" },
    { "Benchmarks" = "development/benchmarks.md" },
  ] },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fullerzz/rex-plugin-sesh"

[project.extra.version]
provider = "mike"
default = "latest"

[project.theme]
variant = "modern"
favicon = "assets/favicon.svg"
language = "en"
features = [
  "content.action.edit",
  "content.tabs.link",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "material/sheep"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.keys = {}
pymdownx.smartsymbols = {}
