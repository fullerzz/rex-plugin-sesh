name: Changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  update-changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag is the only version source: vMAJOR.MINOR.PATCH, optionally
          # with a -PRERELEASE suffix. The justfile's release recipe and
          # release.yml check the same version_re.
          version_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $version_re ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE, got: $TAG" >&2
            exit 1
          fi

      # The range keeps the Herdr history from before the fork out of the
      # changelog.
      - name: Resolve changelog range
        id: changelog-range
        shell: bash
        run: |
          set -euo pipefail
          range=$(bash .github/scripts/changelog-range.sh)
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --verbose ${{ steps.changelog-range.outputs.range }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Prepare main branch update
        shell: bash
        run: |
          set -euo pipefail
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"
          git restore -- CHANGELOG.md
          git fetch origin main
          git switch -C main origin/main
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md

      - name: Commit and push changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(CHANGELOG): update CHANGELOG.md [skip ci]"
          git push origin HEAD:main
