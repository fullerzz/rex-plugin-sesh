name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: true
          install: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: just test

      - name: Test release ref resolution
        run: just test-release-ref

      - name: Build
        run: just build

      - name: CLI smoke test
        run: |
          ./bin/rex-sesh --version
          ./bin/rex-sesh list --json \
            --config testdata/rex-sesh.toml \
            >/tmp/rex-sesh-list.json
          test -s /tmp/rex-sesh-list.json
